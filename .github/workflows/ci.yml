name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:        # also run as the first gate of release.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-vectors:
    name: spec vectors (reference model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: All abstract spec vectors
        run: |
          python spec/vectors/check_vectors.py | tail -1 | tee /dev/stderr | grep -q "mismatches: 0"

  js-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Clean-room JavaScript verifier on all vectors
        working-directory: verifier_js
        run: |
          npm ci
          npm test | tail -5

  swift-verifier:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run the clean-room Swift verifier
        working-directory: verifier_swift
        run: |
          ./build.sh
          ./aarc --quiet --extra extra-vectors

  ts-sdk:
    name: sdk-ts build and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: bash scripts/check-version.sh
      # Integration tests of the client need a running witness; they are not part of this repository (skipped on purpose).
      - name: Type-check, build, dry-run pack
        working-directory: sdk-ts
        run: |
          npm install
          npm run build
          npm pack --dry-run

  python-client:
    name: python client (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows is new here and was never run before: it must not block a release until it has been green once.
    # Remove continue-on-error for windows-latest after the first green run.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: windows-latest
            python: "3.10"
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh          # the same steps run on all three systems; no bash-only syntax below
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel from python/ and install it
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps python -w dist
          python -c "import glob,subprocess,sys; w=glob.glob('dist/*.whl'); assert len(w)==1, w; subprocess.check_call([sys.executable,'-m','pip','install',w[0]])"
      - name: Imports, doctor, hook --print-form, proxy over stdio with the demo upstream (no account, no network)
        run: python scripts/ci_python_smoke.py

  mcp-registry-entry:
    name: server.json (MCP Registry entry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: JSON, registry limits, version == python/pyproject.toml, name == mcp-name of python/README.md
        run: |
          python3 -c "import json;json.load(open('server.json'))"
          bash scripts/check-server-json.sh
