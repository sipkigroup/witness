name: release

# Manual run (workflow_dispatch, only=npm|pypi) or a tag vX.Y.Z  ->  tests -> npm @deus-witness/sdk and PyPI deus-witness
# (OIDC Trusted Publishing + provenance/attestations). No long-lived token is stored anywhere. MCP Registry: disabled below.
# Replace sipkigroup in this repository's files by the GitHub organization (scripts/set-org.sh <org>).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:            # manual run publishes ONE package (npm SDK or the PyPI thin client)
    inputs:
      only:
        description: "what to publish by hand"
        type: choice
        options: [npm, pypi]
        default: npm

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  npm:
    needs: test
    if: github.event_name == 'push' || inputs.only == 'npm'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@deus-witness/sdk
    permissions:
      contents: read
      id-token: write      # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Tag must equal the SDK version
        if: github.event_name == 'push'
        run: bash scripts/check-version.sh "${GITHUB_REF_NAME}"
      - name: npm >= 11.5.1 is required for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version
      - name: "Build and publish (no NODE_AUTH_TOKEN, OIDC)"
        working-directory: sdk-ts
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "@deus-witness/sdk@${v}" version >/dev/null 2>&1; then
            echo "@deus-witness/sdk@${v} is already on npm - skipping (re-run of a tag)"; exit 0
          fi
          npm install
          npm run build
          npm publish --provenance --access public

  pypi:
    needs: test
    if: github.event_name == 'push' || inputs.only == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deus-witness/
    permissions:
      contents: read
      id-token: write      # PyPI Trusted Publishing (OIDC) + attestations
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the thin client
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
          ls -la dist
      - name: Smoke test (install + import + entry points)
        run: |
          python -m pip install python/dist/*.whl
          python -c "import deus_witness, deus_witness.client, deus_witness.proxy, deus_witness.hook.main; print('import ok')"
          deus-witness-hook --print-form >/dev/null && echo "hook ok"
      - name: Publish (no token, OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true

# mcp-registry job is disabled (needs server.json).
#
#  mcp-registry: (environment mcp-registry, mcp-publisher)        - needs server.json, not in this repository
