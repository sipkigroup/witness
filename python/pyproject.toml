[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deus-witness"
version = "0.2.42"
description = "Deus Witness: MCP proxy, Claude Code hook and SDK that send each agent tool call to a witness service before it runs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Developers", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.2,<2", "httpx>=0.27", "cbor2>=5.6", "cryptography>=42"]

[project.optional-dependencies]
verify = ["asn1crypto>=1.5", "opentimestamps>=0.4"]   # only for RFC 3161 tokens and the online Bitcoin anchor check

tee = ["dcap-qvl>=0.7,<0.8"]                          # optional second TDX quote verifier: verify-pack --tee-second-verifier=dcap-qvl

[project.urls]
Homepage = "https://witness.sipkigroup.com"
Documentation = "https://witness.sipkigroup.com/dl/docs/quickstart.html"
Source = "https://github.com/sipkigroup/witness"

[project.scripts]
deus-witness-mcp = "deus_witness.proxy:main"
deus-witness = "deus_witness.doctor:cli"
deus-witness-demo-tools = "deus_witness.demo_upstream:main"
deus-witness-hook = "deus_witness.hook.main:main"
deus-witness-verify-pack = "deus_witness.verify_pack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["deus_witness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
